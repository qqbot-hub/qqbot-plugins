# ============================================================
# NapCatQQ + AstrBot（个人号路线）
#
# 端口说明（都是两家镜像的默认值，冲突就改左边）：
#   3000 NapCat OneBot HTTP   | 3001 NapCat OneBot WS
#   6099 NapCat WebUI（首次扫码登录就开这个） | 6185 AstrBot WebUI
#
# 首次启动后必须人工做的两件事（脚本替不了）：
#   1. 打开 http://127.0.0.1:6099 用 QQ 小号扫码登录
#   2. 打开 http://127.0.0.1:6185 填模型 API Key，并加一个 OneBot 适配器，
#      地址填 ws://napcat:3001（容器内互相访问用服务名）
#
# 注意：napcat 的 HTTP/WS 默认是关的，要在 WebUI 的网络配置里打开，
# 否则 3000/3001 探不到 —— 这不是部署失败，是它故意的安全默认值。
# ============================================================
name: qqbot-napcat-astrbot

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qqbot-napcat
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
      - "6099:6099"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
    environment:
      - NAPCAT_UID=0
      - NAPCAT_GID=0

  astrbot:
    image: soulter/astrbot:latest
    container_name: qqbot-astrbot
    restart: unless-stopped
    depends_on:
      - napcat
    ports:
      - "6185:6185"
    volumes:
      - ./astrbot/data:/AstrBot/data
