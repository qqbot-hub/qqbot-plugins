<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内置语音调音台</title>
<style>body{font:15px system-ui;background:#0b101b;color:#e5eaff;max-width:760px;padding:24px;margin:auto}h1{font-size:26px}label{display:block;margin:16px 0}input,select,textarea,button{font:inherit;background:#16223a;color:inherit;border:1px solid #42587b;border-radius:8px;padding:10px;box-sizing:border-box}input,select,textarea{display:block;width:100%;margin-top:6px}button{cursor:pointer;margin:6px 8px 6px 0}p,small{color:#b2c2dc}audio{width:100%;margin:18px 0}#status{white-space:pre-wrap}a{color:#90b8ff}</style>
<h1>语音调音台</h1><p>随市场运行，与 voice 插件共用配置。试听只在此页播放。</p>
<form id="settings"><label>后端<select name="provider"><option value="baidu">百度翻译 TTS · 免 Key</option><option value="breeze">本地 Breeze</option><option value="voxd">SurfCore voxd</option><option value="openai">OpenAI 兼容云端</option></select></label>
<small>百度及云端会接收试听文本。百度接口无可用性承诺，不支持克隆音色。</small>
<label>接口地址<input name="baseUrl" placeholder="留空使用默认地址"></label><label>API Key<input name="apiKey" type="password" placeholder="留空保留原 Key" autocomplete="off"></label>
<label>模型<input name="model"></label><label>音色<input name="voice"></label><label>语气（Breeze）<input name="instruction"></label><label>语速<input name="speed" type="number" min="0.5" max="2" step="0.1" value="1"></label>
<button type="submit">保存到语音插件</button><button type="button" id="discover">检测本机后端</button></form><div id="backends"></div>
<label>试听文字（最多100字）<textarea id="text" maxlength="100">你好，这是语音试听。</textarea></label><button id="preview">试听已保存配置</button><audio id="player" controls></audio><p id="status" role="status"></p><a href="/" target="_top">返回市场</a>
<script>
const form=document.querySelector('form'),status=document.querySelector('#status');let objectUrl;
async function api(path,body){const r=await fetch('/api/lab/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j;}
api('config').then(j=>{for(const [k,v]of Object.entries(j)){if(form.elements[k] && v!==undefined)form.elements[k].value=v;}status.textContent=j.__configured?.apiKey?'已有 Key，留空保留。':'默认百度免 Key；可选择本地后端。';}).catch(e=>status.textContent=e.message);
form.onsubmit=async e=>{e.preventDefault();try{await api('config',Object.fromEntries(new FormData(form)));status.textContent='已保存到 voice 插件。';form.elements.apiKey.value='';}catch(e){status.textContent=e.message;}};
document.querySelector('#preview').onclick=async function(){this.disabled=true;status.textContent='正在生成…';try{const j=await api('preview',{text:document.querySelector('#text').value});const bytes=Uint8Array.from(atob(j.audio),c=>c.charCodeAt(0));if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(new Blob([bytes],{type:j.mime}));document.querySelector('#player').src=objectUrl;status.textContent='试听已生成，点击播放。未发送 QQ 消息。';}catch(e){status.textContent=e.message;}finally{this.disabled=false;}};
document.querySelector('#discover').onclick=async()=>{try{const j=await api('backends');const box=document.querySelector('#backends');box.replaceChildren();for(const b of j){const p=document.createElement('p');p.textContent=b.id+'：'+(b.online?'API 检查通过':'未识别到有效服务');box.append(p);if(b.online && ['breeze','voxd'].includes(b.id)){const btn=document.createElement('button');btn.textContent='选择 '+b.id;btn.onclick=()=>{form.elements.provider.value=b.id;form.elements.baseUrl.value=b.id==='breeze'?'http://127.0.0.1:8080/v1':'http://127.0.0.1:8765';status.textContent='已选择，请点击保存。';};box.append(btn);}}}catch(e){status.textContent=e.message;}};
</script></html>
